# Kathara lab.conf — Cardinal Phase 1 (SQLi scenario)
#
# Two collision domains (Kathara requires alphanumeric-only names, no hyphens):
#   edgenet  — external tier: locust, attacker, proxy, monitor  (172.30.0.0/24)
#   appnet   — internal tier: proxy, webapp, db, monitor         (172.31.0.0/24)
# Only `proxy` bridges both domains, so it is the sole path from edge to app:
# the choke point is enforced by topology alone (no ACLs in Phase 1).

# --- Proxy (choke point, bridges edge and app networks) ---
# `bridged` gives the proxy a Docker default-bridge NIC so ./expose-ui.sh can
# publish the portal (through the proxy) to the host. It does not weaken the
# choke point: webapp/db remain single-homed on app-net, unreachable from edge.
proxy[0]="edgenet"
proxy[1]="appnet"
proxy[image]="cardinal/proxy"
proxy[bridged]="true"

# --- Webapp (Flask app, internal only) ---
webapp[0]="appnet"
webapp[image]="cardinal/webapp"

# --- Database (MariaDB, internal only) ---
db[0]="appnet"
db[image]="cardinal/db"

# --- Cache (Redis, internal only) ---
# Holds the webapp's serialized session blobs (a realistic deserialization sink
# and benign serialization noise). Internal to app-net.
cache[0]="appnet"
cache[image]="cardinal/cache"

# --- Deserialization service (internal only) ---
# Reconstructs untrusted serialized objects the webapp forwards from its
# object-import endpoint. The target of the insecure-deserialization scenario.
# Kathara names must be alphanumeric (no hyphens), so the node is `desersvc`.
desersvc[0]="appnet"
desersvc[image]="cardinal/desersvc"

# --- Locust (benign traffic generator, external) ---
# `bridged` gives locust an extra NIC on the Docker default bridge. On Docker
# Desktop, Kathara's own host-port publish (`[port]`) does not realise (the
# collision domains are pure L2 and the bridge NIC is added after create), so
# instead of `locust[port]` we expose the UI with ./expose-ui.sh, a published
# socat sidecar that forwards host :8089 -> locust's bridge IP :8089.
locust[0]="edgenet"
locust[image]="cardinal/locust"
locust[bridged]="true"

# --- Attacker (sqlmap, external) ---
attacker[0]="edgenet"
attacker[image]="cardinal/attacker"

# --- Monitor (passive observer, spans both networks) ---
monitor[0]="edgenet"
monitor[1]="appnet"
monitor[image]="cardinal/monitor"

# --- OOB listener (attacker-controlled, internal) ---
# The out-of-band exfiltration target for the OOB SQLi scenario: a DNS collector
# that logs every hostname the compromised db is tricked into resolving.
# On app-net so the single-homed db can reach it; the egress-control defense
# is precisely what cuts that reachability.
oobsvc[0]="appnet"
oobsvc[image]="cardinal/oobsvc"
