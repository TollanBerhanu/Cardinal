# Enforcing mode — BLOCK malicious requests. Served on :80, the real choke point.
# Included LAST in the :80 site so it overrides coraza.conf-recommended (which
# ships as DetectionOnly).
SecRuleEngine On

# Write detections to the Kathara shared dir (same place as db_query.log) so the
# monitor / measurement side (T11) can ingest them: JSON, one record per
# blocked/relevant request, with the matched CRS rule IDs included.
SecAuditEngine RelevantOnly
SecAuditLog /shared/waf_audit.log
SecAuditLogFormat JSON
SecAuditLogParts ABHZ
