# Detection-only baseline — LOG what CRS would block, but still forward the
# request so the attack reaches the app. Served on :8080, the "before the WAF"
# baseline for before/after demos: the same payload that gets 403 on :80
# succeeds here, while the audit log shows the WAF saw it.
SecRuleEngine DetectionOnly

SecAuditEngine RelevantOnly
SecAuditLog /shared/waf_audit.log
SecAuditLogFormat JSON
SecAuditLogParts ABHZ
